name: Scheduled Relocate Works editorial release

on:
  schedule:
    # Daily 00:17 UTC = 07:17 Asia/Bangkok.
    # 20 Nov: original SEO; 21 Nov: evergreen; 22 Nov: gap day.
    - cron: '17 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scheduled-seo-publish
  cancel-in-progress: false

jobs:
  publish-due-article:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Release at most one article in the correct date lane
        run: npm run release:seo
      - name: Verify entire site and both future queues
        run: |
          npm run build
          npm run check:site
          npm run check:seo
          npm test
          npm run check:features
      - name: Commit release manifest and trigger Cloudflare via main
        run: |
          if git diff --quiet -- src/data/seoRelease.json src/data/evergreenRelease.json; then
            echo "No article due; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/seoRelease.json src/data/evergreenRelease.json
          git commit -m "Publish next scheduled Relocate Works editorial article"
          git push origin HEAD:main
