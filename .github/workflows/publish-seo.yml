name: Scheduled SEO editorial release

on:
  schedule:
    # Every day 00:17 UTC = 07:17 Asia/Bangkok.
    # The release script gates exactly one article per 3-day slot.
    - cron: '17 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scheduled-seo-publish
  cancel-in-progress: false

jobs:
  publish-due-article:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Release at most one date-eligible article
        run: npm run release:seo
      - name: Verify the complete site before committing
        run: |
          npm run build
          npm run check:site
          npm run check:seo
          npm test
      - name: Commit new published manifest, triggering Cloudflare deployment
        run: |
          if git diff --quiet -- src/data/seoRelease.json; then
            echo "No article due; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/seoRelease.json
          git commit -m "Publish next scheduled Relocate Works SEO article"
          git push origin HEAD:main
