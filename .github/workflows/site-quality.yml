name: Relocate Works website quality

on:
  push:
    branches:
      - main
      - 'fix/**'
      - 'improve/**'
  pull_request:

permissions:
  contents: read

jobs:
  build-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build Astro site
        run: npm run build
      - name: Audit routes, original country guides and editorial pages
        run: npm run check:site
      - name: Run unit tests for tools and all publication calendars
        run: npm test
      - name: Audit tool pages and accessibility essentials
        run: npm run check:features
      - name: Audit 665 future editorial entries and zero advance publication
        run: npm run check:seo
      - name: Simulate first releases in existing SEO and evergreen queues
        run: |
          node scripts/release-seo.mjs --date=2026-11-20
          npm run build
          npm run check:site
          npm run check:seo
          node scripts/release-seo.mjs --date=2026-11-21
          npm run build
          npm run check:site
          npm run check:seo
          node scripts/release-seo.mjs --date=2026-11-22
          npm run check:seo
      - name: Simulate transition to 365 daily year-three articles
        run: |
          node scripts/simulate-year3.mjs
          node scripts/release-seo.mjs --date=2028-07-11
          npm run build
          npm run check:site
          npm run check:seo
      - name: Save external links for manual editorial review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: external-links-review
          path: reports/external-links.txt
          if-no-files-found: ignore
